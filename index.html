<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alternativas Ciclos | Natura & Avon</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { orange: '#F47920', red: '#9B111E', gray: '#F3F4F6' },
                        avon: { primary: '#E2197C' }
                    },
                    fontFamily: { sans: ['Montserrat', 'sans-serif'] },
                    boxShadow: { 'festive': '0 10px 30px -5px rgba(0, 0, 0, 0.1)' }
                }
            }
        }
    </script>

    <style>
        body { background-color: #F9FAFB; background-attachment: fixed; }
        ::-webkit-scrollbar { height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #F47920; border-radius: 10px; }
        .animate-fade-in { animation: fadeIn 0.3s ease-in-out both; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .snap-x { scroll-snap-type: x mandatory; }
        .snap-start { scroll-snap-align: start; }
    </style>
</head>

<body class="text-gray-800 font-sans antialiased min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-white border-b-2 border-brand-orange shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 py-4 flex flex-col lg:flex-row justify-between items-start lg:items-center gap-4">
            
            <!-- Titulo -->
            <div class="flex-1 w-full">
                <div class="flex items-center gap-3">
                    <span class="text-2xl font-extrabold tracking-tight text-brand-orange" id="brand-title">Ciclo 14</span>
                    <div class="h-6 w-px bg-gray-200"></div>
                    <h1 class="text-xl font-bold text-gray-900">Alternativas 🔄</h1>
                </div>
            </div>
            
            <!-- Filtros -->
            <div class="w-full lg:w-auto flex flex-col sm:flex-row items-end sm:items-center gap-3">
                <div class="w-full sm:w-48">
                    <label class="block text-[10px] font-bold uppercase tracking-widest text-gray-500 mb-1 pl-1">Buscar Producto</label>
                    <div class="relative">
                        <input type="text" id="search-input" placeholder="Ej: 12345..." class="w-full bg-brand-gray border border-gray-200 rounded-xl pl-10 pr-4 py-2.5 text-sm focus:outline-none focus:border-brand-orange focus:ring-2 focus:ring-brand-orange/20">
                        <i data-lucide="search" class="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400"></i>
                    </div>
                </div>

                <div class="w-full sm:w-56">
                    <label class="block text-[10px] font-bold uppercase tracking-widest text-gray-500 mb-1 pl-1">Gerencia</label>
                    <div class="relative">
                        <select id="gerencia-select" class="w-full appearance-none bg-brand-gray border border-gray-200 rounded-xl px-4 py-2.5 text-sm font-semibold focus:outline-none focus:border-brand-orange">
                            <option value="">Cargando gerencias...</option>
                        </select>
                        <i data-lucide="chevron-down" class="absolute right-4 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400"></i>
                    </div>
                </div>

                <div class="w-full sm:w-auto">
                    <button onclick="exportToExcel()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs px-4 py-2.5 rounded-xl transition-all flex items-center justify-center gap-2 h-[42px]">
                        <i data-lucide="file-spreadsheet" class="w-4 h-4 text-white"></i> Descargar Excel
                    </button>
                </div>
            </div>
        </div>
        
        <!-- Pestañas Ciclos 14 y 15 -->
        <div class="max-w-7xl mx-auto px-4 sm:px-6 flex gap-8 border-t border-gray-100 mt-2 lg:mt-0">
            <button onclick="setTab('202614')" id="tab-14" class="py-3 px-1 text-sm font-bold uppercase tracking-widest text-brand-orange border-b-[3px] border-brand-orange transition-all">Ciclo 14</button>
            <button onclick="setTab('202615')" id="tab-15" class="py-3 px-1 text-sm font-bold uppercase tracking-widest text-gray-400 border-b-[3px] border-transparent hover:text-brand-orange transition-all">Ciclo 15</button>
        </div>
    </header>

    <!-- Main -->
    <main class="flex-1 w-full max-w-7xl mx-auto px-4 sm:px-6 py-8">
        <div id="loading" class="flex flex-col justify-center items-center py-20">
            <div class="animate-spin rounded-full h-12 w-12 border-[3px] border-gray-200 border-t-brand-orange"></div>
            <p class="mt-5 text-gray-500 font-bold tracking-widest text-[10px] uppercase animate-pulse">Cargando Alternativas...</p>
        </div>

        <div id="empty-state" class="hidden flex-col justify-center items-center py-24 text-center">
            <h3 class="text-xl font-bold text-gray-800 mb-2">Sin resultados</h3>
            <p class="text-gray-500 text-sm">No encontramos alternativas para esta búsqueda en este ciclo.</p>
        </div>

        <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 hidden"></div>
    </main>

    <footer class="bg-white border-t border-gray-200 py-6 text-center mt-auto">
        <p class="text-[10px] font-bold uppercase tracking-[0.3em] text-gray-400">&copy; <span id="year"></span> Natura &Co</p>
    </footer>

    <script>
        let db = { site: [], gerencias: [], cuotas: {} };
        let state = { tab: '202614', gerenciaId: '', searchQuery: '' };

        async function init() {
            try {
                const response = await fetch('./data.json?v=' + Date.now());
                if (!response.ok) throw new Error('No data');
                const data = await response.json();
                db.site = data.site || [];
                db.gerencias = data.gerencias || [];
                db.cuotas = data.cuotas || {};

                populateGerencias();
                setupSearch();
                document.getElementById('loading').classList.add('hidden');
                render();
            } catch (err) {
                Swal.fire({ title: 'Sin datos', text: 'Ejecutá el Actualizar_Todo.bat para cargar el Excel.', icon: 'info' });
            }
        }

        function populateGerencias() {
            const sel = document.getElementById('gerencia-select');
            sel.innerHTML = '<option value="">Todas las Gerencias</option>';
            db.gerencias.sort((a,b) => a.name.localeCompare(b.name)).forEach(g => {
                const opt = document.createElement('option');
                opt.value = g.id; opt.textContent = g.name;
                sel.appendChild(opt);
            });
            sel.onchange = e => { state.gerenciaId = e.target.value; render(); };
        }

        function setupSearch() {
            document.getElementById('search-input').oninput = e => {
                state.searchQuery = e.target.value.toLowerCase().trim();
                render();
            };
        }

        function setTab(t) {
            state.tab = t;
            const b14 = document.getElementById('tab-14');
            const b15 = document.getElementById('tab-15');
            const title = document.getElementById('brand-title');
            
            if(t === '202614') {
                b14.className = "py-3 px-1 text-sm font-bold uppercase tracking-widest text-brand-orange border-b-[3px] border-brand-orange transition-all";
                b15.className = "py-3 px-1 text-sm font-bold uppercase tracking-widest text-gray-400 border-b-[3px] border-transparent hover:text-brand-orange transition-all";
                title.textContent = "Ciclo 14";
            } else {
                b15.className = "py-3 px-1 text-sm font-bold uppercase tracking-widest text-brand-orange border-b-[3px] border-brand-orange transition-all";
                b14.className = "py-3 px-1 text-sm font-bold uppercase tracking-widest text-gray-400 border-b-[3px] border-transparent hover:text-brand-orange transition-all";
                title.textContent = "Ciclo 15";
            }
            render();
        }

        function getImg(marca, cod, type) {
            const folder = type === 'A' ? marca.trim() : 'Alternativas';
            return `./imagenes/${folder}/${cod}.jpg`;
        }

        function exportToExcel() {
            if (!db.site || db.site.length === 0) return;
            const rows = [];
            let allItems = db.site.filter(i => i.ciclo && i.ciclo.toString().trim() === state.tab);
            const selectedGerenciaId = state.gerenciaId;
            const gerenciasToProcess = selectedGerenciaId ? db.gerencias.filter(g => String(g.id) === String(selectedGerenciaId)) : db.gerencias;

            allItems.forEach(item => {
                const planA = item.plans.find(p => p.type === 'A') || {};
                const planB = item.plans.find(p => p.type === 'B') || {};
                const planC = item.plans.find(p => p.type === 'C') || {};
                const planD = item.plans.find(p => p.type === 'D') || {};

                if (gerenciasToProcess.length > 0) {
                    gerenciasToProcess.forEach(g => {
                        const getStock = (cod) => {
                            if (!cod) return '-';
                            const stock = db.cuotas[g.id]?.[cod];
                            return stock !== undefined ? `${stock} un.` : 'Disponible';
                        };
                        rows.push({
                            'Marca': item.marca, 'Ciclo': item.ciclo, 'Gerencia': g.name,
                            'Cód. Plan A': planA.cod || '', 'Descripción Plan A': planA.desc || '', 'Cuota Plan A': getStock(planA.cod),
                            'Cód. Plan B': planB.cod || '', 'Descripción Plan B': planB.desc || '', 'Cuota Plan B': getStock(planB.cod),
                            'Cód. Plan C': planC.cod || '', 'Descripción Plan C': planC.desc || '', 'Cuota Plan C': getStock(planC.cod),
                            'Cód. Plan D': planD.cod || '', 'Descripción Plan D': planD.desc || '', 'Cuota Plan D': getStock(planD.cod)
                        });
                    });
                } else {
                    rows.push({
                        'Marca': item.marca, 'Ciclo': item.ciclo, 'Gerencia': 'Todas',
                        'Cód. Plan A': planA.cod || '', 'Descripción Plan A': planA.desc || '', 'Cuota Plan A': 'Disponible',
                        'Cód. Plan B': planB.cod || '', 'Descripción Plan B': planB.desc || '', 'Cuota Plan B': 'Disponible',
                        'Cód. Plan C': planC.cod || '', 'Descripción Plan C': planC.desc || '', 'Cuota Plan C': 'Disponible',
                        'Cód. Plan D': planD.cod || '', 'Descripción Plan D': planD.desc || '', 'Cuota Plan D': 'Disponible'
                    });
                }
            });

            const worksheet = XLSX.utils.json_to_sheet(rows);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, `Alternativas`);
            XLSX.writeFile(workbook, `Alternativas_${state.tab}_${new Date().toISOString().slice(0, 10)}.xlsx`);
        }

        function render() {
            const grid = document.getElementById('product-grid');
            const empty = document.getElementById('empty-state');
            grid.innerHTML = '';

            let filtered = db.site.filter(i => i.ciclo && i.ciclo.toString().trim() === state.tab);

            if (state.searchQuery) {
                const q = state.searchQuery;
                filtered = filtered.map(item => {
                    const matchingPlans = item.plans.filter(p => p.cod.toString().toLowerCase().includes(q) || p.desc.toLowerCase().includes(q));
                    return matchingPlans.length > 0 ? { ...item, plans: matchingPlans } : null;
                }).filter(Boolean);
            }

            if (filtered.length === 0) {
                grid.classList.add('hidden');
                empty.classList.remove('hidden');
                empty.classList.add('flex');
            } else {
                grid.classList.remove('hidden');
                empty.classList.add('hidden');
                empty.classList.remove('flex');

                filtered.forEach((item, idx) => {
                    const card = document.createElement('div');
                    card.className = "animate-fade-in bg-white rounded-2xl border border-gray-100 shadow-festive hover:-translate-y-1 transition-all flex flex-col overflow-hidden";
                    card.style.animationDelay = `${idx * 0.05}s`;

                    const carousel = document.createElement('div');
                    carousel.className = "flex overflow-x-auto snap-x";
                    
                    item.plans.forEach(plan => {
                        const slide = document.createElement('div');
                        slide.className = "min-w-full snap-start p-4 flex flex-col";
                        const isMain = plan.type === 'A';
                        const badgeColor = isMain ? (item.marca.toLowerCase().includes('natura') ? 'bg-brand-orange' : 'bg-avon-primary') : 'bg-gray-800';
                        
                        let quotaHTML = "";
                        if (state.gerenciaId) {
                            const stock = db.cuotas[state.gerenciaId]?.[plan.cod];
                            if (stock !== undefined) {
                                quotaHTML = stock > 0 ? `<span class="text-[11px] font-bold text-emerald-700">Stock: ${stock} un.</span>` : `<span class="text-[11px] font-bold text-red-600">Agotado</span>`;
                            } else {
                                quotaHTML = `<span class="text-[11px] font-bold text-emerald-700">Disponible</span>`;
                            }
                        } else {
                            quotaHTML = `<span class="text-[10px] text-gray-400 italic">Elegí Gerencia</span>`;
                        }

                        const imgPath = getImg(item.marca, plan.cod, plan.type);
                        
                        slide.innerHTML = `
                            <div class="relative mb-4">
                                ${!isMain ? `<span class="absolute top-2 left-2 z-10 ${badgeColor} text-white text-[9px] font-bold px-3 py-1 rounded-lg uppercase shadow-sm">Alternativa ${plan.type}</span>` : ''}
                                <div class="w-full aspect-square bg-gray-50 rounded-xl border border-gray-100 overflow-hidden flex items-center justify-center">
                                    <img src="${imgPath}" onerror="this.src='https://placehold.co/400x400/FFF/ccc?text=Sin+Foto'" class="w-full h-full object-contain mix-blend-multiply">
                                </div>
                            </div>
                            <div class="flex-1 flex flex-col">
                                <span class="text-[10px] text-gray-400 font-bold uppercase mb-1">${item.marca} \vert{} Cód: ${plan.cod}</span>
                                <h4 class="text-sm font-bold text-gray-800 leading-tight mb-4 flex-1">${plan.desc}</h4>
                                <div class="pt-3 border-t border-gray-100 flex justify-between">${quotaHTML}</div>
                            </div>
                        `;
                        carousel.appendChild(slide);
                    });

                    card.appendChild(carousel);
                    if (item.plans.length > 1) {
                        const info = document.createElement('div');
                        info.className = "px-5 pb-4 text-[9px] font-bold uppercase text-gray-400 flex items-center gap-2";
                        info.innerHTML = `<i data-lucide="arrow-left-right" class="w-3"></i> Desliza para alternativas`;
                        card.appendChild(info);
                    }
                    grid.appendChild(card);
                });
            }
            lucide.createIcons();
            document.getElementById('year').textContent = new Date().getFullYear();
        }
        window.onload = init;
    </script>
</body>
</html>
